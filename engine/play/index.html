<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FreeCAD wasm playground (G5)</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; display: flex; height: 100vh; }
  #left { width: 42%; display: flex; flex-direction: column; border-right: 1px solid #8884; }
  #right { flex: 1; position: relative; }
  textarea { flex: 1; font: 13px/1.4 ui-monospace, Consolas, monospace; padding: 8px; border: 0; resize: none; }
  #bar { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid #8884; align-items: center; }
  #status { padding: 6px 8px; font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; border-top: 1px solid #8884; max-height: 30vh; overflow: auto; }
  button { font: inherit; padding: 6px 14px; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div id="left">
    <div id="bar">
      <button id="run">Run</button>
      <button id="save" disabled>Save .FCStd</button>
    </div>
    <textarea id="code" spellcheck="false">import sys
import FreeCAD as App
import Part

doc = App.newDocument("G5Play")

box = doc.addObject("Part::Box", "Box")
box.Length = 40
box.Width = 40
box.Height = 20

cyl = doc.addObject("Part::Cylinder", "Cylinder")
cyl.Radius = 6
cyl.Height = 20
cyl.Placement = App.Placement(App.Vector(20, 20, 0), App.Rotation())

cut = doc.addObject("Part::Cut", "Cut")
cut.Base = box
cut.Tool = cyl
doc.recompute()

# Tessellate for the three.js viewport: (vertices, triangle index list).
verts, tris = cut.Shape.tessellate(0.1)

import json
import os
os.makedirs("/out", exist_ok=True)
with open("/out/mesh.json", "w") as f:
    json.dump({
        "volume": cut.Shape.Volume,
        "vertices": [[v.x, v.y, v.z] for v in verts],
        "triangles": [list(t) for t in tris],
    }, f)

doc.saveAs("/out/model.FCStd")
print("G5_RESULT:PASS volume=%r" % cut.Shape.Volume)
</textarea>
    <pre id="status">Loading kernel...</pre>
  </div>
  <div id="right"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="/play.js"></script>
</body>
</html>
