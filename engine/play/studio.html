<title>reSHape Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#14171c; --panel:#1c2027; --raised:#242a33; --hair:#2e353f;
    --text:#d7dde5; --muted:#8b95a3; --accent:#5aa9e6;
    --font-ui:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0; background:var(--ground); color:var(--text);
    font:13px/1.4 var(--font-ui); overflow:hidden;
  }
  button, input{ font-family:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:1px; border-radius:2px; }

  .uc{ text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:var(--muted); font-weight:600; }

  /* ---------- shell ---------- */
  #app{
    height:100vh;
    display:grid;
    grid-template-columns:240px 1fr;
    grid-template-rows:50px 62px minmax(0,1fr) 108px;
    grid-template-areas:
      "topbar   topbar"
      "toolbar  toolbar"
      "tree     viewport"
      "statusbar statusbar";
  }

  /* ---------- top bar ---------- */
  .topbar{
    grid-area:topbar; display:flex; align-items:center; gap:12px;
    padding:0 14px; background:var(--panel); border-bottom:1px solid var(--hair);
  }
  .wordmark{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; white-space:nowrap; }
  .wordmark .mark{
    width:22px; height:22px; border-radius:5px;
    background:linear-gradient(135deg, var(--accent), #3d7fb8);
    display:flex; align-items:center; justify-content:center;
    color:#0d1116; font-size:12px; font-weight:700;
  }
  .wordmark .re{ color:var(--muted); font-weight:500; }
  .tagline{ color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- feature toolbar ---------- */
  .toolbar{
    grid-area:toolbar; background:var(--panel); border-bottom:1px solid var(--hair);
    display:flex; align-items:stretch; overflow-x:auto; overflow-y:hidden;
  }
  .tgroup{
    display:flex; align-items:center; gap:8px; padding:0 12px;
    border-right:1px solid var(--hair); flex-shrink:0;
  }
  .tgroup:last-of-type{ border-right:none; }

  .fbtn{
    appearance:none; border:1px solid transparent; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    width:64px; height:46px; border-radius:6px; color:var(--text);
    transition:background .12s ease, border-color .12s ease;
  }
  .fbtn svg{ width:18px; height:18px; color:var(--accent); }
  .fbtn span{ font-size:9.5px; line-height:1; color:var(--muted); white-space:nowrap; }
  .fbtn:hover:not(:disabled){ background:var(--raised); border-color:var(--hair); }
  .fbtn:hover:not(:disabled) span{ color:var(--text); }
  .fbtn:disabled, .fbtn.ghost{ opacity:.4; cursor:not-allowed; }
  .fbtn:disabled svg, .fbtn.ghost svg{ color:var(--muted); }

  /* Script box: same hairline language as the dims inputs, but mono and
     multi-line-capable (rows=1 collapses to the toolbar's 62px height;
     it grows with content via field-sizing where supported). */
  .script-src{
    background:var(--raised); color:var(--text);
    font:12px/1.3 var(--font-mono);
    border:1px solid var(--hair); border-radius:4px;
    padding:4px 8px; width:220px; resize:vertical; field-sizing:content;
  }
  .script-src:focus{ border-color:var(--accent); outline:none; }
  .script-src::placeholder{ color:var(--muted); }

  .btn{
    appearance:none; cursor:pointer; border-radius:6px; padding:7px 14px;
    font-size:12.5px; font-weight:600; border:1px solid var(--hair);
    background:var(--raised); color:var(--text); white-space:nowrap;
  }
  .btn:hover:not(:disabled){ border-color:var(--accent); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#0d1116; }
  .btn.primary:hover:not(:disabled){ filter:brightness(1.08); }

  .dims{ display:flex; align-items:center; gap:5px; color:var(--muted); font-size:11px; }
  .dims label{ display:flex; align-items:center; gap:4px; }
  input[type="number"], input[type="text"]{
    width:52px; background:var(--ground); color:var(--text); border:1px solid var(--hair);
    border-radius:5px; padding:5px 6px; font:12px var(--font-mono); text-align:right;
  }
  input:focus-visible{ border-color:var(--accent); }

  .spacer{ flex:1; }

  /* ---------- left dock / model tree ---------- */
  #tree{
    grid-area:tree; background:var(--panel); border-right:1px solid var(--hair);
    display:flex; flex-direction:column; min-height:0;
  }
  .dock-header{ padding:9px 14px; border-bottom:1px solid var(--hair); flex-shrink:0; }
  #treeList{ list-style:none; margin:0; padding:6px 0; overflow-y:auto; flex:1; }
  .tree-row{
    display:flex; align-items:baseline; gap:7px; padding:5px 14px;
    border-left:2px solid transparent; font-size:12.5px; cursor:pointer;
  }
  .tree-row:hover{ background:rgba(255,255,255,.03); border-left-color:var(--accent); }
  .tree-row-sel{ background:rgba(90,169,230,.14); border-left-color:var(--accent); }
  .tree-row .tk{
    flex-shrink:0; font:10.5px var(--font-mono); color:var(--muted);
    background:var(--raised); border:1px solid var(--hair); border-radius:4px; padding:1px 5px;
  }

  #histPanel{
    border-top:1px solid var(--hair); padding:10px 14px; flex-shrink:0;
    display:flex; flex-direction:column; gap:8px;
  }
  #histPanel .hist-type{ font:11px var(--font-mono); text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  #histPanel label{ display:flex; align-items:center; gap:6px; font-size:12px; }
  #histPanel .hist-actions{ display:flex; gap:6px; }

  /* ---------- 3D viewport ---------- */
  #right{
    grid-area:viewport; position:relative; min-height:0; min-width:0;
    background:radial-gradient(ellipse at 50% 40%, #1a1e25 0%, #14171c 70%);
    overflow:hidden;
  }
  #right canvas{ display:block; }

  .navcube-wrap{
    position:absolute; top:14px; right:14px; z-index:4;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    pointer-events:none;
  }
  .navcube-scene{ width:56px; height:56px; perspective:300px; }
  .navcube{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transform:rotateX(-18deg) rotateY(38deg); }
  .navcube .face{
    position:absolute; width:56px; height:56px; background:var(--raised); border:1px solid var(--hair);
    display:flex; align-items:center; justify-content:center;
    font-size:8.5px; font-weight:600; letter-spacing:.06em; color:var(--muted);
  }
  .navcube .face.top{ transform:rotateX(90deg) translateZ(28px); }
  .navcube .face.front{ transform:translateZ(28px); }
  .navcube .face.right{ transform:rotateY(90deg) translateZ(28px); }

  .triad{ position:absolute; bottom:14px; right:14px; width:52px; height:52px; z-index:4; opacity:.85; pointer-events:none; }

  .viewport-hint{
    position:absolute; bottom:12px; left:12px; z-index:3; pointer-events:none;
    font-size:11px; color:var(--muted); background:rgba(20,23,28,.6); padding:4px 8px; border-radius:5px;
  }

  /* ---------- sketch mode ---------- */
  #right.sketching .navcube-wrap, #right.sketching .triad, #right.sketching .viewport-hint{ display:none; }

  .sketch-overlay{
    position:absolute; inset:0; z-index:5; background:var(--ground);
    display:flex; flex-direction:column;
  }
  /* The `hidden` attribute must beat the display:flex author rules above/below,
     or Finish Sketch (which sets .hidden) leaves the overlay + dim popup parked
     over the 3D view. The UA [hidden] rule is too weak against a class rule. */
  .sketch-overlay[hidden], .dim-input[hidden]{ display:none !important; }
  .sketch-toolbar{
    display:flex; align-items:center; gap:0; padding:0 12px; height:52px; flex-shrink:0;
    background:var(--panel); border-bottom:1px solid var(--hair); overflow-x:auto;
  }
  .sk-group{ display:flex; align-items:center; gap:6px; padding:0 12px; border-right:1px solid var(--hair); flex-shrink:0; }
  .sk-group:last-of-type{ border-right:none; }
  .fbtn.small{ width:52px; height:40px; }
  .fbtn.active{ background:var(--raised); border-color:var(--accent); }
  .fbtn.active span{ color:var(--text); }

  .dof-badge{
    font:11px var(--font-mono); text-transform:uppercase; letter-spacing:.06em;
    padding:5px 10px; border-radius:5px; background:var(--raised); border:1px solid var(--hair); color:var(--muted);
    white-space:nowrap;
  }
  .dof-badge.dof-ok{ color:#5fbf8f; border-color:#5fbf8f; }
  .dof-badge.dof-warn{ color:#d9a94e; border-color:#d9a94e; }
  .dof-badge.dof-bad{ color:#e0685a; border-color:#e0685a; }

  .sketch-svg{ flex:1; width:100%; height:100%; display:block; }
  .sk-line{ stroke:var(--text); stroke-width:.6; fill:none; }
  .sk-line-sel{ stroke:var(--accent); stroke-width:1; }
  .sk-vertex{ fill:var(--text); }
  .sk-vertex-sel{ fill:var(--accent); }
  #rubberBand{ stroke:var(--accent); stroke-width:.5; opacity:.7; }
  .sk-preview{ fill:none; stroke:var(--accent); stroke-width:.5; stroke-dasharray:1.2,1.2; opacity:.7; }
  #snapRing{ fill:none; stroke:var(--accent); stroke-width:.4; opacity:.9; }
  #axisHint{ fill:var(--accent); font:4px var(--font-mono); }

  .sk-toggle{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); white-space:nowrap; user-select:none; cursor:pointer; }
  .sk-toggle input{ accent-color:var(--accent); }

  .dim-input{
    position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:6;
    display:flex; align-items:center; gap:8px; background:var(--raised); border:1px solid var(--hair);
    border-radius:8px; padding:8px 10px; box-shadow:0 4px 16px rgba(0,0,0,.4);
  }
  .dim-input label{ display:flex; align-items:center; gap:6px; }

  /* ---------- status / log pane ---------- */
  #status{
    grid-area:statusbar; margin:0; padding:8px 14px; overflow:auto;
    background:#0e1116; border-top:1px solid var(--hair); color:var(--muted);
    font:11px/1.5 var(--font-mono); white-space:pre-wrap;
  }

  @media (max-width:900px){
    #app{ grid-template-columns:200px 1fr; }
    .fbtn{ width:52px; }
  }
</style>

<div id="app">
  <header class="topbar">
    <div class="wordmark"><span class="mark">rS</span><span><span class="re">re</span>SHape Studio</span></div>
    <span class="tagline">parametric CAD in the browser</span>
  </header>

  <nav class="toolbar" aria-label="Feature tools">
    <div class="tgroup" aria-label="Body">
      <button id="newBody" class="fbtn" disabled title="New Body — start a new PartDesign body">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 7.5v9L12 21 4 16.5v-9z"/></svg>
        <span>New Body</span>
      </button>
    </div>

    <div class="tgroup" aria-label="Sketch">
      <button id="rect" class="fbtn" disabled title="Rect Sketch — draw a rectangle sketch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
        <span>Rect Sketch</span>
      </button>
      <span class="dims"><label>W <input id="w" type="number" value="40"></label><label>H <input id="h" type="number" value="40"></label></span>

      <button id="circle" class="fbtn" disabled title="Circle Sketch — draw a circle sketch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg>
        <span>Circle Sketch</span>
      </button>
      <span class="dims"><label>r <input id="r" type="number" value="6"></label></span>

      <button id="sketchNew" class="fbtn" disabled title="New Sketch — draw a constrained sketch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5"/><circle cx="5" cy="19" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="5" r="1.4" fill="currentColor" stroke="none"/></svg>
        <span>New Sketch</span>
      </button>
      <button id="sketchFinish" class="fbtn" style="display:none" title="Finish Sketch — exit sketch mode and hand off to Pad">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        <span>Finish Sketch</span>
      </button>
    </div>

    <div class="tgroup" aria-label="Additive features">
      <button id="pad" class="fbtn" disabled title="Pad — extrude the sketch into a solid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="14" height="7" rx="1"/><path d="M12 10V3"/><path d="M8.5 6.5 12 3l3.5 3.5"/></svg>
        <span>Pad</span>
      </button>
      <button id="pocket" class="fbtn" disabled title="Pocket — cut the sketch profile inward (Length below sets the depth)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="7" rx="1"/><path d="M12 14v7"/></svg>
        <span>Pocket</span>
      </button>
      <button id="revolve" class="fbtn" disabled title="Revolve — spin the sketch profile around its vertical axis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="4" ry="8"/><path d="M12 4V2M12 22v-2"/><path d="M9 3.5a9 9 0 0 0 0 17"/></svg>
        <span>Revolve</span>
      </button>
      <span class="dims"><label>° <input id="revAngle" type="number" value="360"></label></span>
      <button id="fillet" class="fbtn" disabled title="Fillet — round the selected edge (pick an edge first)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10a6 6 0 0 1 6-6h10"/></svg>
        <span>Fillet</span>
      </button>
      <button id="chamfer" class="fbtn" disabled title="Chamfer — bevel the selected edge (pick an edge first)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10a4 4 0 0 1 4-4h10"/><path d="M4 10 10 4"/></svg>
        <span>Chamfer</span>
      </button>
      <span class="dims"><label>R/size <input id="filletR" type="number" value="5"></label></span>
      <button id="loftBtn" class="fbtn" disabled title="Loft — skin between the two most recent sketches (needs two)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8c0-2.2 3.6-4 8-4s8 1.8 8 4-3.6 4-8 4-8-1.8-8-4z"/><path d="M4 8v8c0 2.2 3.6 4 8 4s8-1.8 8-4V8"/></svg>
        <span>Loft</span>
      </button>
      <button id="pipeBtn" class="fbtn" disabled title="Pipe — sweep the second-last sketch along the last one">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13.5" width="5" height="5" rx="1"/><path d="M8 16c6.5 0 3.5-9 11-9"/><path d="M16.5 4.5 19 7l-2.5 2.5"/></svg>
        <span>Pipe</span>
      </button>
      <button id="helixBtn" class="fbtn" disabled title="Helix — sweep the last sketch along a helical ride">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><ellipse cx="12" cy="7" rx="5" ry="2"/><ellipse cx="12" cy="12" rx="5" ry="2"/><ellipse cx="12" cy="17" rx="5" ry="2"/></svg>
        <span>Helix</span>
      </button>
      <span class="dims"><label>H <input id="helixH" type="number" value="20"></label><label>T <input id="helixT" type="number" value="3"></label></span>
    </div>

    <div class="tgroup" aria-label="Subtractive features">
      <button id="grooveBtn" class="fbtn" disabled title="Groove — spin the last sketch around its V axis, removing material">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="7" rx="6" ry="2.5"/><path d="M6 7v10c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V7"/><path d="M6 12h12" stroke-dasharray="2.5 2"/><path d="M16.5 19.5h4.5"/></svg>
        <span>Groove</span>
      </button>
      <span class="dims"><label>° <input id="grooveAngle" type="number" value="360"></label></span>
      <button id="subLoftBtn" class="fbtn" disabled title="Sub Loft — remove the shape lofted between the last two sketches">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8c0-2.2 3.6-4 8-4s8 1.8 8 4-3.6 4-8 4-8-1.8-8-4z"/><path d="M4 8v8c0 2.2 3.6 4 8 4s8-1.8 8-4V8"/><path d="M16.5 19.5h4.5"/></svg>
        <span>Sub Loft</span>
      </button>
      <span class="dims"><label>gap <input id="subLoftGap" type="number" value="0"></label></span>
      <!-- Sub Helix reuses the Helix group's helixH / helixT inputs on purpose:
           they mean the same thing. One pair serves both buttons; do not add a
           second labelled pair. -->
      <button id="subHelixBtn" class="fbtn" disabled title="Sub Helix — the same helical ride, removing material">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><ellipse cx="12" cy="7" rx="5" ry="2"/><ellipse cx="12" cy="12" rx="5" ry="2"/><ellipse cx="12" cy="17" rx="5" ry="2"/><path d="M16.5 20.5h4.5"/></svg>
        <span>Sub Helix</span>
      </button>
      <button id="subPipeBtn" class="fbtn" disabled title="Sub Pipe — sweep along a path, removing material">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13.5" width="5" height="5" rx="1"/><path d="M8 16c6.5 0 3.5-9 11-9"/><path d="M16.5 4.5 19 7l-2.5 2.5"/><path d="M16.5 19.5h4.5"/></svg>
        <span>Sub Pipe</span>
      </button>
    </div>

    <div class="tgroup" aria-label="Primitives">
      <button id="prismBtn" class="fbtn" disabled title="Prism — add a hexagonal prism">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>
        <span>Prism</span>
      </button>
      <span class="dims"><label>r <input id="prismR" type="number" value="10"></label><label>h <input id="prismH" type="number" value="30"></label></span>
      <button id="wedgeBtn" class="fbtn" disabled title="Wedge — add a right wedge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h18L3 6v12z"/></svg>
        <span>Wedge</span>
      </button>
      <span class="dims"><label>w <input id="wedgeW" type="number" value="30"></label><label>h <input id="wedgeH" type="number" value="25"></label></span>
      <button id="sphereBtn" class="fbtn" disabled title="Sphere — add a sphere">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M4 12h16"/></svg>
        <span>Sphere</span>
      </button>
      <span class="dims"><label>r <input id="sphereR" type="number" value="8"></label></span>
      <button id="coneBtn" class="fbtn" disabled title="Cone — add a cone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 4 20h16L12 4z"/></svg>
        <span>Cone</span>
      </button>
      <span class="dims"><label>r <input id="coneR" type="number" value="6"></label><label>h <input id="coneH" type="number" value="25"></label></span>
      <button id="torusBtn" class="fbtn" disabled title="Torus — add a torus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>
        <span>Torus</span>
      </button>
      <span class="dims"><label>R <input id="torusR" type="number" value="16"></label><label>r <input id="torusr" type="number" value="4"></label></span>
    </div>

    <div class="tgroup" aria-label="Patterns">
      <button id="linPatBtn" class="btn" disabled title="Linear Pattern — repeat the latest feature along Z (needs a feature)">Lin Pattern</button>
      <span class="dims"><label>n <input id="patCount" type="number" value="3"></label><label>step <input id="patStep" type="number" value="20"></label></span>
      <button id="polPatBtn" class="btn" disabled title="Polar Pattern — repeat the latest feature around Z (needs a feature)">Pol Pattern</button>
    </div>

    <div class="tgroup" aria-label="Edit">
      <span class="dims">Length <input id="len" type="number" value="20"></span>
      <button id="apply" class="btn" disabled>Set Length</button>
    </div>

    <div class="tgroup" aria-label="Pick">
      <button id="pickFaces" class="btn primary" disabled title="Pick Faces — click a face of the solid">Faces</button>
      <button id="pickEdges" class="btn" disabled title="Pick Edges — click an edge of the solid">Edges</button>
      <span class="dims">Selected <span id="selReadout" class="uc">—</span></span>
    </div>

    <div class="tgroup" aria-label="Script">
      <textarea id="scriptSrc" class="script-src" rows="1" spellcheck="false"
        placeholder="cuboid(40, 40, 20)&#10;holeThrough(6)" title="reSHape Script — statements, one per line"></textarea>
      <button id="scriptRun" class="btn primary" disabled title="Run Script — transpile and execute the statements">Run Script</button>
    </div>

    <span class="spacer"></span>

    <div class="tgroup" aria-label="File" style="border-right:none;">
      <button id="save" class="btn" disabled>Save .FCStd</button>
      <button id="open" class="btn" disabled>Open .FCStd</button>
      <button id="exportStl" class="btn" disabled title="Export STL — download the current solid as an STL mesh">Export STL</button>
      <input id="file" type="file" accept=".FCStd,.fcstd" hidden>
    </div>
  </nav>

  <aside id="tree">
    <div class="dock-header uc">Model Tree</div>
    <ul id="treeList"></ul>
    <div id="histPanel" hidden>
      <div id="histType" class="hist-type">—</div>
      <label id="histValueRow"><span id="histParamLabel">Value</span> <input id="histValue" type="number"></label>
      <div class="hist-actions">
        <button id="histApply" class="btn primary">Apply</button>
        <button id="histDelete" class="btn">Delete</button>
      </div>
    </div>
  </aside>

  <div id="right">
    <div class="navcube-wrap">
      <div class="navcube-scene">
        <div class="navcube">
          <div class="face top">TOP</div>
          <div class="face front">FRONT</div>
          <div class="face right">RIGHT</div>
        </div>
      </div>
    </div>
    <svg class="triad" viewBox="0 0 60 60" aria-hidden="true">
      <g stroke-width="2" stroke-linecap="round">
        <line x1="30" y1="30" x2="52" y2="30" stroke="#e0685a"/>
        <line x1="30" y1="30" x2="30" y2="8" stroke="#5fbf8f"/>
        <line x1="30" y1="30" x2="14" y2="46" stroke="var(--accent)"/>
      </g>
      <text x="55" y="33" font-size="9" fill="#e0685a" font-family="var(--font-mono)">X</text>
      <text x="27" y="6" font-size="9" fill="#5fbf8f" font-family="var(--font-mono)">Y</text>
      <text x="6" y="52" font-size="9" fill="var(--accent)" font-family="var(--font-mono)">Z</text>
    </svg>
    <div class="viewport-hint">Drag to orbit · scroll to zoom</div>

    <div id="sketchOverlay" class="sketch-overlay" hidden>
      <div class="sketch-toolbar" aria-label="Sketch tools">
        <div class="sk-group" aria-label="Draw tools">
          <button id="toolLine" class="fbtn small active" title="Line — click to place points, click the start point to close the loop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 20 4"/></svg>
            <span>Line</span>
          </button>
          <button id="toolSelect" class="fbtn small" title="Select — click a line or a point, shift-click to add">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M4 4l7 16 2-7 7-2z"/></svg>
            <span>Select</span>
          </button>
          <button id="toolRect" class="fbtn small" title="Rectangle — click two opposite corners">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
            <span>Rect</span>
          </button>
          <button id="toolCircle" class="fbtn small" title="Circle — click center, then a point on the circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg>
            <span>Circle</span>
          </button>
          <button id="toolArc" class="fbtn small" title="Arc — click center, start point, then end direction">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a14 14 0 0 1 16-16"/></svg>
            <span>Arc</span>
          </button>
          <button id="toolEllipse" class="fbtn small" title="Ellipse — click center, a point setting the width, then a point setting the height">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="5"/></svg>
            <span>Ellipse</span>
          </button>
          <button id="toolPoint" class="fbtn small" title="Point — click to place a construction point">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/></svg>
            <span>Point</span>
          </button>
        </div>
        <div class="sk-group" aria-label="Constraints">
          <button id="cHoriz" class="btn" disabled title="Horizontal — needs 1 line">Horizontal</button>
          <button id="cVert" class="btn" disabled title="Vertical — needs 1 line">Vertical</button>
          <button id="cCoin" class="btn" disabled title="Coincident — needs 2 points">Coincident</button>
          <button id="cPar" class="btn" disabled title="Parallel — needs 2 lines">Parallel</button>
          <button id="cPerp" class="btn" disabled title="Perpendicular — needs 2 lines">Perpendicular</button>
          <button id="cEq" class="btn" disabled title="Equal — needs 2 lines">Equal</button>
          <button id="cSym" class="btn" disabled title="Symmetric — needs 3 points">Symmetric</button>
          <button id="cDistX" class="btn" disabled title="Dist X — needs 2 points">Dist X</button>
          <button id="cDistY" class="btn" disabled title="Dist Y — needs 2 points">Dist Y</button>
          <button id="cAngle" class="btn" disabled title="Angle — needs 2 lines">Angle</button>
          <button id="cDim" class="btn" disabled title="Dimension — needs 1 line, circle, or arc">Dimension</button>
          <button id="cDelete" class="btn" disabled title="Delete — remove selected geometry (Delete/Backspace)">Delete</button>
        </div>
        <div class="sk-group" aria-label="Auto-constrain">
          <label class="sk-toggle"><input id="autoConstrain" type="checkbox" checked> Auto</label>
        </div>
        <span class="spacer"></span>
        <span id="dofBadge" class="dof-badge">—</span>
      </div>

      <svg id="sketchSvg" class="sketch-svg" viewBox="-15 -95 110 110" preserveAspectRatio="xMidYMid meet">
        <g id="gridLayer"></g>
        <g id="geomLayer"></g>
        <line id="rubberBand" class="sk-line" stroke-dasharray="1.2,1.2" hidden></line>
        <rect id="previewRect" class="sk-preview" hidden></rect>
        <circle id="previewCircle" class="sk-preview" hidden></circle>
        <polyline id="previewArc" class="sk-preview" hidden></polyline>
        <ellipse id="previewEllipse" class="sk-preview" hidden></ellipse>
        <circle id="snapRing" r="1.8" hidden></circle>
        <text id="axisHint" hidden></text>
      </svg>

      <div id="dimInput" class="dim-input" hidden>
        <label class="uc"><span id="dimLabel">Length</span> <input id="dimValue" type="number" step="0.1" min="0.01"></label>
        <button id="dimOk" class="btn primary">Set</button>
        <button id="dimCancel" class="btn">Cancel</button>
      </div>
    </div>
  </div>

  <pre id="status">loading engine…</pre>
</div>
