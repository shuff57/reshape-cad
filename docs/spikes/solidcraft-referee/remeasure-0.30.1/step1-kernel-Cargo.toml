# Generated for the 0.30.1 rig (Stage B). Copy of packages/solidcraft-host/kernel/Cargo.toml.in; changes listed in /home/shuff57/.cache/solidcraft-0.30.1-rig/RIG-CHANGES.md.
[package]
name = "solidcraft-referee"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solidcraft-engine = { path = "/home/shuff57/.cache/solidcraft-0.30.1-rig/sc-src/crates/engine" }
solidcraft-doc = { path = "/home/shuff57/.cache/solidcraft-0.30.1-rig/sc-src/crates/doc" }
serde_json = "1"
wasm-bindgen = "=0.2.129"

# = upstream v0.30.1 [profile.release] verbatim
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = "line-tables-only"

# = upstream v0.30.1 root [patch.crates-io] verbatim (paths made absolute)
[patch.crates-io]
truck-geometry = { path = "/home/shuff57/.cache/solidcraft-0.30.1-rig/sc-src/vendor/truck-geometry" }
truck-shapeops = { path = "/home/shuff57/.cache/solidcraft-0.30.1-rig/sc-src/vendor/truck-shapeops" }
truck-stepio = { path = "/home/shuff57/.cache/solidcraft-0.30.1-rig/sc-src/vendor/truck-stepio" }
truck-meshalgo = { path = "/home/shuff57/.cache/solidcraft-0.30.1-rig/sc-src/vendor/truck-meshalgo" }
matext4cgmath = { path = "/home/shuff57/.cache/solidcraft-0.30.1-rig/sc-src/vendor/matext4cgmath" }

# Keep OpenGL pipelines, resolve textures and CAD callbacks at the same safe sample count.
egui-wgpu = { path = "/home/shuff57/.cache/solidcraft-0.30.1-rig/sc-src/vendor/egui-wgpu" }

# Deliver trackpad pinch and rotation gestures on Wayland (zwp_pointer_gestures_v1), which
# winit 0.30 never binds and eframe 0.36 still requires winit 0.30.
winit = { path = "/home/shuff57/.cache/solidcraft-0.30.1-rig/sc-src/vendor/winit" }

# macOS: dropping the accessibility adapter leaves AppKit's key-value observers intact (#7535).
accesskit_macos = { path = "/home/shuff57/.cache/solidcraft-0.30.1-rig/sc-src/vendor/accesskit_macos" }

