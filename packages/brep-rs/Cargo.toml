[package]
name = "brep-rs"
version = "0.1.0"
edition = "2021"
description = "Independent Rust B-rep kernel for reshape-cad, compiled to wasm (SPEC-brep-kernel-rs)."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
