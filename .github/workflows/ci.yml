# Build and test on every push and pull request.
#
# WHY THIS DID NOT EXIST BEFORE. It could not: `npm test` ran the ModelDoc
# OCCT gate, and until 0366d95 that gate needed RESHAPE_KERNEL_DIR pointed at a
# sibling shCode checkout holding a 23 MB gitignored replicad_single.wasm. No
# runner has that. That gate is no longer in `npm test` at all, and OCCT
# arrives as a pinned devDependency; `npm ci` covers the JavaScript half.
#
# The OTHER half is Rust. Since brep-rs became the only kernel, `npm ci` is no
# longer the whole setup: the wasm has to be built here or the kernel suite
# cannot import it.
#
# WHAT IT RUNS, and the order matters: the test suites import from
# `packages/*/dist`, not from `src`, because dist is what a browser and shCode
# both load. So the build is not a separate nicety -- skip it and every suite
# measures whatever dist happened to be committed last.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # v7, not v4. The first green run carried a deprecation annotation: v4
      # targets Node 20, which GitHub now force-runs on Node 24 and will stop
      # supporting on its own schedule. That is the one failure in this file
      # no test of ours can see coming -- a stale build order breaks the build
      # step and CI says so, but a retired runtime breaks the workflow itself,
      # from the outside, with nothing in this repo changing.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # Restores ~/.npm between runs. Worth having here specifically:
          # replicad-opencascadejs unpacks to ~49 MB and is fetched every run
          # without it.
          cache: npm

      - name: Install
        run: npm ci

      # THE KERNEL IS RUST NOW, and this step is why CI has never actually run
      # the test suite. packages/brep-rs/pkg is wasm-pack output, gitignored
      # (pkg/.gitignore is `*`), so a fresh checkout has no wasm at all --
      # measured: with pkg/ moved aside the kernel suite exits 1 (1 fail, 1
      # error) because brep-rs-engine-adapter.test.mjs readFileSync's the
      # .wasm at module load. Every green run this file has ever had predates
      # that test. Build the kernel before anything imports it.
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      # Keyed on Cargo.lock, and it caches ~/.cargo/bin so wasm-pack itself is
      # installed once rather than compiled on every run (a cold
      # `cargo install wasm-pack` is minutes, not seconds).
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            packages/brep-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/brep-rs/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --locked

      - name: Build the kernel wasm
        run: wasm-pack build --release --target web --out-dir pkg
        working-directory: packages/brep-rs

      # The kernel's own native tests. They never needed wasm and so were never
      # run here either; the toolchain is present now, so there is no reason
      # for the Rust half of the product to stay unmeasured on push.
      #
      # continue-on-error is load-bearing, and the reason is this repo's own
      # convention: a pinned known defect is a RED test (`spike_*`), not an
      # ignored one. So `cargo test --release` exits non-zero on a healthy tree,
      # and without this every later step is SKIPPED -- measured on the 2026-10-01
      # run of 36794016882: the build was never attempted and `npm test` never
      # ran, so one deliberate red test cost the whole JS half of the product its
      # only coverage. main has been red since 4dd1e58 for exactly this reason.
      #
      # This step therefore reports without blocking, and the step BELOW re-runs
      # the same suite with the known-defect tests skipped, so a NEW failure still
      # blocks. The skip list is the whole contract: a renamed test stops
      # matching its pattern and therefore starts blocking again (fail-safe), and a
      # new deliberate red test has to be added here on purpose.
      - name: Test the kernel natively
        continue-on-error: true
        run: cargo test --release
        working-directory: packages/brep-rs

      # The blocking half: 256 pass / 0 fail locally at 3b5aa9a. Each --skip is one
      # pinned known defect -- the two long-standing spikes plus K-H's C0, C2 and C6.
      - name: Test the kernel natively, new breakage only
        run: >-
          cargo test --release --
          --skip spike_coplanar_chamfer
          --skip spike_countersink
          --skip spike_c0_
          --skip spike_c2_
          --skip spike_c6_
        working-directory: packages/brep-rs

      # `npm run build`, NOT `npm run build --workspaces`. Measured on this
      # workflow's own first run: --workspaces builds in workspace order
      # (kernel, script, sketch, studio) while the dependency order is
      # sketch -> script -> kernel -> studio, so kernel compiled first and
      # could not resolve @shuff57/reshape-script/model-types -- dist/ is
      # gitignored, so on a fresh checkout it did not exist yet. It passed on
      # every developer machine because dist/ was already lying there from an
      # earlier build. The root script now enforces the order.
      - name: Build every workspace, in dependency order
        run: npm run build

      # check-record, then the workspace suites. NOT the gates: they measure
      # brep-rs against OpenCascade as a referee, on demand, and a referee
      # disagreeing is a finding for a person to read rather than a red build.
      # The product's own coverage is what runs here -- including the kernel
      # adapter suite, which exercises the real wasm built above.
      - name: Test
        run: npm test
