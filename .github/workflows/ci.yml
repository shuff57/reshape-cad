# Build and test on every push and pull request.
#
# WHY THIS DID NOT EXIST BEFORE. It could not: `npm test` ran the ModelDoc
# OCCT gate, and until 0366d95 that gate needed RESHAPE_KERNEL_DIR pointed at a
# sibling shCode checkout holding a 23 MB gitignored replicad_single.wasm. No
# runner has that. That gate is no longer in `npm test` at all, and OCCT
# arrives as a pinned devDependency; `npm ci` covers the JavaScript half.
#
# The OTHER half is Rust. Since brep-rs became the only kernel, `npm ci` is no
# longer the whole setup: the wasm has to be built here or the kernel suite
# cannot import it.
#
# WHAT IT RUNS, and the order matters: the test suites import from
# `packages/*/dist`, not from `src`, because dist is what a browser and shCode
# both load. So the build is not a separate nicety -- skip it and every suite
# measures whatever dist happened to be committed last.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that supersedes an earlier one cancels the older run. Without this,
# three pushes in a minute queue three 8-minute jobs measuring the same tree at
# different points, and the badge shows whichever finished last.
concurrency:
  group: ci-${{ github.ref }}
  # PRs cancel their stale run; every push to main runs to completion, so no main commit goes unchecked
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The kernel's own native tests, in their own job. They need neither Node nor
  # the wasm, and nothing in build-and-test reads their output, so they run in
  # parallel with it instead of in front of it. Before this split they were
  # ~4 of the job's ~6.5 minutes (run 42961392405: compile 61 s, then the full
  # 746-test suite twice at ~93 s each), all of it on the critical path.
  kernel-native:
    runs-on: ubuntu-latest
    # Measured ~3 min. The ceiling is for a hung test, not a slow day: without
    # it a deadlocked test holds the runner for GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Keyed on Cargo.lock. Its own key, not build-and-test's: this job builds
      # host-target release artifacts and that one builds wasm32, so sharing a
      # key would make the two jobs race to save a cache that only fits one.
      #
      # v6, not v4: v4's action.yml declares `using: node20`, which GitHub
      # force-runs on Node 24 and warned about on every run. Nothing in this
      # repo would have changed when Node 20 stops being supported -- the job
      # would just start failing from the outside.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            archive/brep-rs/target
          key: cargo-native-${{ runner.os }}-${{ hashFiles('archive/brep-rs/Cargo.lock') }}
          restore-keys: cargo-native-${{ runner.os }}-

      # They never needed wasm and so were never run here either; the toolchain
      # is present, so there is no reason for the Rust half of the product to
      # stay unmeasured on push.
      #
      # THE BLOCKING HALF. This repo's convention is that a pinned known defect
      # is a RED test (`spike_*`), not an ignored one, so a plain
      # `cargo test --release` exits non-zero on a healthy tree. Each --skip is
      # one pinned known defect -- the two long-standing spikes plus K-H's C0,
      # C2 and C6 -- and everything else must pass. The skip list is the whole
      # contract: a renamed test stops matching its pattern and therefore starts
      # blocking again (fail-safe), and a new deliberate red test has to be
      # added here on purpose.
      - name: Test the kernel natively, new breakage only
        run: >-
          cargo test --release --
          --skip spike_coplanar_chamfer
          --skip spike_countersink
          --skip spike_c0_
          --skip spike_c2_
          --skip spike_c6_
        working-directory: archive/brep-rs

      # THE REPORTING HALF: exactly the tests skipped above, and nothing else,
      # so the two steps together cover the full suite once. This used to be a
      # second full `cargo test --release` that re-ran all ~740 non-spike tests
      # (~93 s) only to report on these five patterns. Same filters, so the
      # same tests: libtest's positional filters and --skip are both substring
      # matches on the test path.
      #
      # continue-on-error is load-bearing: a red spike is the expected state of
      # a known defect and must not red the job. `!cancelled()` so the report
      # still runs when the blocking step above fails, as it did when this step
      # ran first.
      - name: Test the kernel natively, known defects (reports, never blocks)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: >-
          cargo test --release --
          spike_coplanar_chamfer
          spike_countersink
          spike_c0_
          spike_c2_
          spike_c6_
        working-directory: archive/brep-rs

  build-and-test:
    runs-on: ubuntu-latest
    # Measured ~2-3 min after the split; the suites once took 12+ min on their
    # own (run 38269968000), so the ceiling leaves room for that, not more.
    timeout-minutes: 30
    steps:
      # v7, not v4. The first green run carried a deprecation annotation: v4
      # targets Node 20, which GitHub now force-runs on Node 24 and will stop
      # supporting on its own schedule. That is the one failure in this file
      # no test of ours can see coming -- a stale build order breaks the build
      # step and CI says so, but a retired runtime breaks the workflow itself,
      # from the outside, with nothing in this repo changing.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # Restores ~/.npm between runs. Worth having here specifically:
          # replicad-opencascadejs unpacks to ~49 MB and is fetched every run
          # without it.
          cache: npm

      - name: Install
        run: npm ci

      # THE KERNEL IS RUST NOW, and this step is why CI has never actually run
      # the test suite. archive/brep-rs/pkg is wasm-pack output, gitignored
      # (pkg/.gitignore is `*`), so a fresh checkout has no wasm at all --
      # measured: with pkg/ moved aside the kernel suite exits 1 (1 fail, 1
      # error) because brep-rs-engine-adapter.test.mjs readFileSync's the
      # .wasm at module load. Every green run this file has ever had predates
      # that test. Build the kernel before anything imports it.
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      # Keyed on Cargo.lock; see kernel-native for why the key is per job and
      # why v6. ~/.cargo/bin is no longer cached: wasm-pack arrives prebuilt
      # from the step below.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            archive/brep-rs/target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('archive/brep-rs/Cargo.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      # A prebuilt, checksum-verified wasm-pack binary, not `cargo install`.
      # The cargo cache used to carry the compiled binary, but GitHub evicts a
      # cache after 7 days unused and every Cargo.lock change misses it, and a
      # cold `cargo install wasm-pack` is ~60 s (run 42961392405). This takes
      # seconds either way. Pinned by commit (v2.90.3) and by wasm-pack version
      # so a release of either cannot change what this job runs.
      - name: Install wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.15.1

      - name: Build the kernel wasm
        run: wasm-pack build --release --target web --out-dir pkg
        working-directory: archive/brep-rs

      # `npm run build`, NOT `npm run build --workspaces`. Measured on this
      # workflow's own first run: --workspaces builds in workspace order
      # (kernel, script, sketch, studio) while the dependency order is
      # sketch -> script -> kernel -> studio, so kernel compiled first and
      # could not resolve @shuff57/reshape-script/model-types -- dist/ is
      # gitignored, so on a fresh checkout it did not exist yet. It passed on
      # every developer machine because dist/ was already lying there from an
      # earlier build. The root script now enforces the order.
      - name: Build every workspace, in dependency order
        run: npm run build

      # Live-reference gate: the guard-layer fuzz scored against the
      # independent oracle. Without the rig there is nothing to measure, so the
      # gate SKIPS (exit 0) -- CI has no rig. With the rig it fails on any wrong
      # solid. The scored run happens on a box that has the rig (see the
      # remaining-work loop report); this step is the fail-safe wiring.
      - name: Live-reference gate (skips without the rig)
        id: live-gate
        continue-on-error: true
        run: sh packages/layer/test/live-gate.sh

      # check-record, then the workspace suites. NOT the gates: they measure
      # brep-rs against OpenCascade as a referee, on demand, and a referee
      # disagreeing is a finding for a person to read rather than a red build.
      # The product's own coverage is what runs here -- including the kernel
      # adapter suite, which exercises the real wasm built above.
      #
      # WHY ONE STEP PER PACKAGE. `npm test --workspaces` stops at the first
      # red workspace, and the job then reports only that "Test" failed. Finding
      # out WHICH package broke meant grepping ~18,000 log lines. Named steps
      # put the package in the red X. Every suite reports rather than blocks, so
      # one red does not hide the other three; the single blocking gate is the
      # aggregation step below.
      - name: check-record
        run: node scripts/check-record.mjs bench/record.json

      - name: Test sketch
        id: test-sketch
        continue-on-error: true
        run: npm test -w @shuff57/reshape-sketch

      - name: Test script
        id: test-script
        continue-on-error: true
        run: npm test -w @shuff57/reshape-script

      - name: Test brep-adapter
        id: test-adapter
        continue-on-error: true
        run: npm test -w @shuff57/reshape-brep-adapter

      - name: Test studio
        id: test-studio
        continue-on-error: true
        run: npm test -w @shuff57/reshape-studio

      # The only step that reds the job. A suite that is skipped or cancelled
      # is not a pass, so anything other than `success` fails here.
      - name: All suites passed
        if: always()
        env:
          SKETCH: ${{ steps.test-sketch.outcome }}
          SCRIPT: ${{ steps.test-script.outcome }}
          ADAPTER: ${{ steps.test-adapter.outcome }}
          STUDIO: ${{ steps.test-studio.outcome }}
        run: |
          failed=0
          for pair in "sketch:$SKETCH" "script:$SCRIPT" "brep-adapter:$ADAPTER" "studio:$STUDIO"; do
            name=${pair%%:*}
            outcome=${pair#*:}
            if [ "$outcome" != "success" ]; then
              echo "::error::$name suite: $outcome"
              failed=1
            fi
          done
          exit $failed
